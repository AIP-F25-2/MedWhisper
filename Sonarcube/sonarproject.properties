# === Project identification ===
sonar.organization=aip-f25-2
sonar.projectKey=AIP-F25-2_MedWhisper
sonar.projectName=MedWhisper
sonar.sourceEncoding=UTF-8

# === Source configuration ===
# Scan everything in the repo by default
sonar.sources=.

# Exclude non-code / noisy folders
sonar.exclusions=**/venv/**,**/.venv/**,**/env/**,**/.env/**,**/node_modules/**,**/tests/**,**/*.md,**/*.yml,**/*.yaml,**/.github/**,**/__pycache__/**,**/.mypy_cache/**

# === Python settings ===
sonar.python.version=3.10

# (Optional, sonar.language is deprecated and can be removed)
# sonar.language=py

